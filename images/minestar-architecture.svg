<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <style>.title{font:bold 20px sans-serif;} .box{fill:#f0fff0;stroke:#006400;stroke-width:2;} .small{font:14px sans-serif;}</style>
  <text x="20" y="30" class="title">MineStar / DISPATCH - System Architecture (Conceptual)</text>
  <rect x="50" y="60" width="340" height="70" class="box" rx="8"/>
  <text x="80" y="100" class="small">DISPATCH Core Server</text>
  <rect x="420" y="60" width="300" height="70" class="box" rx="8"/>
  <text x="450" y="100" class="small">LP / Joptimizer Engine</text>
  <rect x="790" y="60" width="300" height="70" class="box" rx="8"/>
  <text x="820" y="100" class="small">MineView & Reporting</text>

  <rect x="120" y="180" width="220" height="60" class="box" rx="6"/>
  <text x="140" y="215" class="small">Controller / FormView</text>
  <rect x="420" y="180" width="220" height="60" class="box" rx="6"/>
  <text x="450" y="215" class="small">Builder / Tire & Blend Utilities</text>
  <rect x="720" y="180" width="320" height="60" class="box" rx="6"/>
  <text x="740" y="215" class="small">Shovel Need / TI Page</text>

  <rect x="150" y="300" width="200" height="60" class="box" rx="6"/>
  <text x="170" y="335" class="small">On-board Displays (Jpanel)</text>
  <rect x="450" y="300" width="200" height="60" class="box" rx="6"/>
  <text x="490" y="335" class="small">VIMS / Payload & GPS</text>
  <rect x="750" y="300" width="200" height="60" class="box" rx="6"/>
  <text x="770" y="335" class="small">TMAC / Telemetry Network</text>

  <line x1="200" y1="130" x2="380" y2="180" stroke="#006400" stroke-width="3" marker-end="url(#arrm)"/>
  <line x1="580" y1="130" x2="530" y2="180" stroke="#006400" stroke-width="3" marker-end="url(#arrm)"/>
  <line x1="900" y1="130" x2="820" y2="180" stroke="#006400" stroke-width="3" marker-end="url(#arrm)"/>

  <defs>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#006400" />
    </marker>
  </defs>

  <text x="20" y="560" class="small">MineStar DISPATCH architecture with Joptimizer and TI Page components (conceptual schematic).</text>
</svg>