<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <style>.title{font:bold 18px sans-serif;} .box{fill:#fff6e6;stroke:#bf6b00;stroke-width:2;} .small{font:13px sans-serif;}</style>
  <text x="20" y="30" class="title">Hexagon FMS — Empty Truck Assignment Flow</text>
  <rect x="50" y="60" width="220" height="50" class="box" rx="6"/>
  <text x="80" y="90" class="small">Trigger: Truck dumps (Empty)</text>
  <rect x="300" y="60" width="260" height="50" class="box" rx="6"/>
  <text x="340" y="90" class="small">Aggregate Telemetry & State</text>
  <rect x="50" y="150" width="200" height="50" class="box" rx="6"/>
  <text x="60" y="180" class="small">Compute Shovel Need (LP targets)</text>
  <rect x="300" y="150" width="260" height="50" class="box" rx="6"/>
  <text x="320" y="180" class="small">Rank Candidate Trucks (Cost)</text>
  <rect x="600" y="150" width="300" height="50" class="box" rx="6"/>
  <text x="620" y="180" class="small">Apply Business Rules & Locks</text>
  <rect x="350" y="260" width="300" height="50" class="box" rx="6"/>
  <text x="380" y="290" class="small">Select & Assign Truck</text>
  <rect x="350" y="360" width="300" height="50" class="box" rx="6"/>
  <text x="380" y="390" class="small">Update Dashboard & Telemetry</text>

  <!-- arrows -->
  <line x1="170" y1="110" x2="300" y2="110" stroke="#bf6b00" stroke-width="2" marker-end="url(#arrh)"/>
  <line x1="150" y1="200" x2="300" y2="200" stroke="#bf6b00" stroke-width="2" marker-end="url(#arrh)"/>
  <line x1="560" y1="200" x2="600" y2="200" stroke="#bf6b00" stroke-width="2" marker-end="url(#arrh)"/>
  <line x1="760" y1="200" x2="650" y2="260" stroke="#bf6b00" stroke-width="2" marker-end="url(#arrh)"/>
  <line x1="500" y1="310" x2="500" y2="360" stroke="#bf6b00" stroke-width="2" marker-end="url(#arrh)"/>

  <defs>
    <marker id="arrh" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf6b00" />
    </marker>
  </defs>

  <text x="20" y="560" class="small">Hexagon flow integrates geo-analytics and telemetry intensively into the assignment decision.</text>
</svg>