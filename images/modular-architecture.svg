<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <style>.title{font: bold 20px sans-serif;} .box{fill:#e8f4ff;stroke:#2b7bb9;stroke-width:2;} .small{font:14px sans-serif;}</style>
  <text x="20" y="30" class="title">Modular FMS - System Architecture (Conceptual)</text>
  <rect x="50" y="60" width="300" height="70" class="box" rx="8"/>
  <text x="80" y="100" class="small">Application Server</text>
  <rect x="420" y="60" width="300" height="70" class="box" rx="8"/>
  <text x="450" y="100" class="small">Database & LP Engine</text>
  <rect x="790" y="60" width="300" height="70" class="box" rx="8"/>
  <text x="820" y="100" class="small">Reporting & Dashboard</text>

  <rect x="100" y="180" width="220" height="60" class="box" rx="6"/>
  <text x="120" y="215" class="small">Controller Console</text>
  <rect x="420" y="180" width="220" height="60" class="box" rx="6"/>
  <text x="450" y="215" class="small">Builder Tools</text>
  <rect x="740" y="180" width="220" height="60" class="box" rx="6"/>
  <text x="760" y="215" class="small">Fleet Update Assistant</text>

  <rect x="150" y="300" width="200" height="60" class="box" rx="6"/>
  <text x="170" y="335" class="small">On-board Units</text>
  <rect x="450" y="300" width="200" height="60" class="box" rx="6"/>
  <text x="490" y="335" class="small">GPS / Payload</text>
  <rect x="750" y="300" width="200" height="60" class="box" rx="6"/>
  <text x="770" y="335" class="small">Telemetry Network</text>

  <!-- arrows -->
  <line x1="200" y1="130" x2="300" y2="180" stroke="#2b7bb9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="540" y1="130" x2="540" y2="180" stroke="#2b7bb9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="130" x2="800" y2="180" stroke="#2b7bb9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="250" y1="240" x2="250" y2="300" stroke="#2b7bb9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="240" x2="540" y2="300" stroke="#2b7bb9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="240" x2="840" y2="300" stroke="#2b7bb9" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b7bb9" />
    </marker>
  </defs>

  <text x="20" y="560" class="small">Note: Modular FMS uses modular components; architecture is conceptual and shows data & control flow between server, consoles, and field units.</text>
</svg>