<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <style>.title{font:bold 18px sans-serif;} .box{fill:#f7fff7;stroke:#228b22;stroke-width:2;} .small{font:14px sans-serif;}</style>
  <text x="20" y="30" class="title">MineStar — BP / LP / DP Layered Flow</text>
  <rect x="50" y="60" width="330" height="80" class="box" rx="8"/>
  <text x="70" y="110" class="small">Best Path & Road Models</text>
  <rect x="430" y="60" width="330" height="80" class="box" rx="8"/>
  <text x="460" y="110" class="small">Joptimizer / LP</text>
  <rect x="810" y="60" width="330" height="80" class="box" rx="8"/>
  <text x="830" y="110" class="small">DISPATCH Dynamic Assignment (DP)</text>

  <line x1="380" y1="100" x2="430" y2="100" stroke="#228b22" stroke-width="3" marker-end="url(#arrm)"/>
  <line x1="760" y1="100" x2="810" y2="100" stroke="#228b22" stroke-width="3" marker-end="url(#arrm)"/>

  <defs>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#228b22" />
    </marker>
  </defs>

  <text x="20" y="320" class="small">BP feeds travel times to Joptimizer; LP sets arcs & targets; DP enforces assignments and reports back status.</text>
</svg>