<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <style>.title{font:bold 18px sans-serif;} .box{fill:#e8f4ff;stroke:#2b7bb9;stroke-width:2;} .small{font:13px sans-serif;}</style>
  <text x="20" y="30" class="title">MineStar DISPATCH — Empty Truck Assignment Flow</text>
  <rect x="50" y="60" width="220" height="50" class="box" rx="6"/>
  <text x="80" y="90" class="small">Trigger: Truck dumps (Empty)</text>
  <rect x="300" y="60" width="260" height="50" class="box" rx="6"/>
  <text x="340" y="90" class="small">Capture Snapshot & LP Targets</text>
  <rect x="50" y="150" width="200" height="50" class="box" rx="6"/>
  <text x="60" y="180" class="small">Evaluate Neediest Shovel</text>
  <rect x="300" y="150" width="260" height="50" class="box" rx="6"/>
  <text x="320" y="180" class="small">Compute Truck Costs (travel & idle)</text>
  <rect x="600" y="150" width="300" height="50" class="box" rx="6"/>
  <text x="620" y="180" class="small">Check Locks/Assignability</text>
  <rect x="350" y="260" width="300" height="50" class="box" rx="6"/>
  <text x="380" y="290" class="small">Assign Truck & Update TI</text>

  <!-- arrows -->
  <line x1="170" y1="110" x2="300" y2="110" stroke="#2b7bb9" stroke-width="2" marker-end="url(#arrm)"/>
  <line x1="150" y1="200" x2="300" y2="200" stroke="#2b7bb9" stroke-width="2" marker-end="url(#arrm)"/>
  <line x1="560" y1="200" x2="600" y2="200" stroke="#2b7bb9" stroke-width="2" marker-end="url(#arrm)"/>
  <line x1="760" y1="200" x2="650" y2="260" stroke="#2b7bb9" stroke-width="2" marker-end="url(#arrm)"/>
  <line x1="500" y1="310" x2="500" y2="360" stroke="#2b7bb9" stroke-width="2" marker-end="url(#arrm)"/>

  <defs>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b7bb9" />
    </marker>
  </defs>

  <text x="20" y="560" class="small">MineStar flow shows DISPATCH/Joptimizer coordination for assignment decisions.</text>
</svg>